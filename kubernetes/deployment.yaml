apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: country-app
  template:
    metadata:
      labels:
        app: country-app
    spec:
      containers:
      - name: country-app
        image: country-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: country-app
  template:
    metadata:
      labels:
        app: country-app
    spec:
      containers:
      - name: country-app
        image: country-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
